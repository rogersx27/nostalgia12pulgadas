<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiquetas QR · Nostalgia 12"</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 8px 0 28px; }
    .controles label { flex: 1 1 320px; font: 700 12px "Space Mono", monospace; text-transform: uppercase; }
    .controles input { display: block; width: 100%; margin-top: 6px; padding: 12px; font: 15px "Space Mono", monospace; border: 2px solid var(--tinta); background: var(--papel-2); color: var(--tinta); }
    .aviso { background: var(--mostaza); color: #141110; padding: 12px 16px; margin-bottom: 20px; font-size: 15px; }
    .hojas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding-bottom: 60px; }
    .etiqueta-qr { background: #fff; color: #141110; border: 2px dashed #141110; padding: 16px; text-align: center; break-inside: avoid; }
    .etiqueta-qr .marca { justify-content: center; font-size: 15px; margin-bottom: 8px; }
    .etiqueta-qr img { width: 100%; max-width: 180px; image-rendering: pixelated; }
    .etiqueta-qr b { display: block; font: 400 16px/1.1 "Archivo Black", sans-serif; margin-top: 8px; }
    .etiqueta-qr small { display: block; font-size: 11px; margin-top: 4px; }
    @media print {
      body { background: #fff; }
      .top, .controles, .aviso, h1 { display: none !important; }
      .hojas { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <header class="envoltura top">
    <a class="marca" href="index.html"><span class="mini-disco" aria-hidden="true"></span>Nostalgia 12"</a>
    <nav><a href="index.html">← Inicio</a></nav>
  </header>
  <main class="envoltura">
    <h1 style="font-size:40px">Etiquetas QR</h1>
    <div class="controles">
      <label>URL de la página del vinilo<input id="base" type="url"></label>
      <button class="boton" onclick="print()">Imprimir</button>
    </div>
    <p class="aviso" id="aviso" hidden>Estás abriendo el sitio desde tu computador: estos QR solo funcionan aquí. Publica el sitio (por ejemplo en GitHub Pages o Netlify) y pon arriba su dirección, terminando en <b>/vinilo.html</b>.</p>
    <div class="hojas" id="hojas"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="vinilos.js"></script>
  <script>
    const base = document.getElementById('base');
    base.value = location.href.replace(/qr\.html.*$/, 'vinilo.html');
    document.getElementById('aviso').hidden = location.protocol !== 'file:';

    function pintar() {
      document.getElementById('hojas').innerHTML = VINILOS.map(v => {
        const qr = qrcode(0, 'M');
        qr.addData(`${base.value.trim()}?id=${encodeURIComponent(v.id)}`);
        qr.make();
        return `<figure class="etiqueta-qr">
          <div class="marca">● Nostalgia 12"</div>
          <img src="${qr.createDataURL(8, 2)}" alt="QR de ${v.titulo}">
          <b>${v.artista} – ${v.titulo}</b>
          <small class="mono">Escanéame: estado, prensaje y canciones · ${v.id.toUpperCase()}</small>
        </figure>`;
      }).join('');
    }
    base.addEventListener('input', pintar);
    pintar();
  </script>
</body>
</html>
