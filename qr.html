<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiquetas QR — Nostalgia 12"</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .taller { max-width: 1180px; margin: 0 auto; padding: 24px var(--orilla) 80px; }
    .taller h1 { font: 800 clamp(32px, 4vw, 48px)/1.2 var(--f-mincho); }
    .taller > p { max-width: 40em; margin: 10px 0 28px; color: var(--tinta-suave); }
    .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 28px; }
    .controles label { flex: 1 1 320px; font: 500 14px var(--f-gotica); }
    .controles input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font: 400 15px var(--f-gotica); border: 1px solid var(--tinta-suave); border-radius: 4px; background: var(--washi); color: var(--tinta-rollo); }
    .controles button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--tinta); color: var(--muro); font: 500 15px var(--f-gotica); }
    .aviso-qr { background: var(--washi); color: var(--tinta-rollo); padding: 14px 18px; margin-bottom: 24px; font: 400 15px/1.6 var(--f-gotica); }
    .hojas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .etiqueta-qr { position: relative; background: #fbfaf5; color: #182f48; border: 1px dashed #9a9090; padding: 18px 16px 20px; text-align: center; break-inside: avoid; }
    .etiqueta-qr .m { font: 400 11px var(--f-marca); letter-spacing: .3em; }
    .etiqueta-qr img { width: 100%; max-width: 170px; image-rendering: pixelated; margin: 10px auto 6px; display: block; }
    .etiqueta-qr b { display: block; font: 800 16px/1.2 var(--f-mincho); }
    .etiqueta-qr small { display: block; font: 400 11px/1.5 var(--f-gotica); margin-top: 6px; color: #3c4f63; }
    .etiqueta-qr i { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; display: grid; place-items: center; background: #c0482f; color: #f0efe8; font: 800 13px/1 var(--f-mincho); font-style: normal; border-radius: 2px; }
    @media print {
      :root { --tinta: #182f48; --tinta-suave: #3c4f63; --muro: #fff; }
      body { background: #fff; color: #182f48; }
      .cabecera, .controles, .aviso-qr, .taller > h1, .taller > p { display: none !important; }
      .hojas { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="./"><img src="assets/logo.jpg" alt="" width="44" height="44"><span><b>NOSTALGIA 12"</b><small lang="ja">懐かしい</small></span></a>
    <nav aria-label="Enlaces"><a href="./">Volver a la sala</a></nav>
  </header>
  <main class="taller">
    <h1>Etiquetas QR</h1>
    <p>Una etiqueta por disco, para pegar en la funda. Al escanearla se abre su página en la sala.</p>
    <div class="controles">
      <label>Dirección de la página del disco<input id="base" type="url"></label>
      <button type="button" onclick="print()">Imprimir</button>
    </div>
    <p class="aviso-qr" id="aviso" hidden>Estás abriendo el sitio desde tu computador: estos QR solo funcionan aquí. Abre esta página desde el sitio publicado antes de imprimir.</p>
    <div class="hojas" id="hojas"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="vinilos.js"></script>
  <script>
    const base = document.getElementById('base');
    base.value = location.href.replace(/qr\.html.*$/, 'vinilo.html');
    document.getElementById('aviso').hidden = location.protocol !== 'file:';

    function pintar() {
      document.getElementById('hojas').innerHTML = VINILOS.map(v => {
        const qr = qrcode(0, 'M');
        qr.addData(`${base.value.trim()}?id=${encodeURIComponent(v.id)}`);
        qr.make();
        return `<figure class="etiqueta-qr">
          <i lang="ja" aria-hidden="true">懐</i>
          <div class="m">NOSTALGIA 12"</div>
          <img src="${qr.createDataURL(8, 2)}" alt="QR de ${v.titulo}">
          <b>${v.titulo}</b>
          <small>${v.artista} · ${v.anio}<br>Escanéame: su estado, su historia y sus canciones</small>
        </figure>`;
      }).join('');
    }
    base.addEventListener('input', pintar);
    pintar();
  </script>
</body>
</html>
